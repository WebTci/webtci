<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>پشتیبانی ماهریاب</title>
<meta name="description" content="پیگیری تماس‌های پشتیبانی مخاطبان ماهریاب" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ماهریاب" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.6/dist/jalaali.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { vazir: ['Vazirmatn', 'sans-serif'] },
        colors: {
          brand: {
            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
            400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
            800: '#1e40af', 900: '#1e3a8a'
          }
        }
      }
    }
  };
</script>

<style>
  html, body { font-family: 'Vazirmatn', sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #bfdbfe; border-radius: 999px; }
  .tab-scroll::-webkit-scrollbar { display: none; }
  .tab-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  .pill { transition: all .15s ease; }
  .pill[data-selected="true"] { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
  .card-enter { animation: cardIn .25s ease both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .toast-enter { animation: toastIn .2s ease both; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .spinner { border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; width: 16px; height: 16px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  input[type="checkbox"].chk { accent-color: #1d4ed8; }
  .nav-btn.active { color: #1d4ed8; font-weight: 800; }
  .gated { opacity: .45; pointer-events: none; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<div id="toast-root" class="fixed top-3 inset-x-0 z-[80] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

<div class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-sm flex flex-col relative">

  <!-- نوار بالای برنامه -->
  <header class="sticky top-0 z-30 bg-white border-b border-slate-100">
    <div class="flex items-center justify-between px-4 pt-4 pb-3">
      <div class="flex items-center gap-1">
        <button id="btn-notif" title="اعلان‌ها" class="relative w-9 h-9 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" /></svg>
          <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-brand-600"></span>
        </button>
        <button id="btn-menu" title="بروزرسانی" class="w-9 h-9 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </div>
      <div class="flex items-center gap-2.5">
        <div class="text-right">
          <h1 class="font-extrabold text-brand-700 text-[15px] leading-tight">پشتیبانی ماهریاب</h1>
          <p id="conn-status" class="text-[11px] text-slate-400 leading-tight">در حال بررسی اتصال…</p>
        </div>
        <div class="w-10 h-10 shrink-0 rounded-2xl bg-brand-700 text-white flex items-center justify-center font-extrabold">م</div>
      </div>
    </div>

    <!-- بخش‌های مخصوص صفحه مخاطبین -->
    <div id="contacts-chrome">
      <div class="px-4 pb-3">
        <div class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" /></svg>
          <input id="search-input" type="text" placeholder="جستجوی نام، شماره یا حیطه فعالیت…"
            class="w-full bg-white border border-slate-200 placeholder-slate-300 text-slate-700 text-sm rounded-xl pl-9 pr-3 py-2.5 outline-none focus:border-brand-400 transition" />
        </div>
      </div>
      <nav id="tabs" class="tab-scroll flex gap-2 px-4 pb-3 overflow-x-auto"></nav>
      <nav id="subtabs" class="tab-scroll flex gap-2 px-4 pb-3 overflow-x-auto"></nav>
    </div>
  </header>

  <!-- صفحه‌ها -->
  <main class="flex-1">
    <div id="page-contacts">
      <div id="list-root" class="px-3 py-3 space-y-3 pb-24"></div>
      <div id="empty-state" class="hidden flex-1 flex-col items-center justify-center px-8 py-16 text-center text-slate-400 gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-brand-200 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M4 6h16v14H4z" /></svg>
        <p id="empty-state-text" class="text-sm">موردی برای نمایش نیست</p>
      </div>
      <div id="loading-state" class="flex flex-col items-center justify-center px-8 py-16 gap-3">
        <div class="w-8 h-8 border-4 border-brand-100 border-t-brand-600 rounded-full animate-spin"></div>
        <p class="text-sm text-slate-400">در حال دریافت اطلاعات…</p>
      </div>
    </div>

    <div id="page-calendar" class="hidden px-3 py-3 pb-24"></div>
    <div id="page-stats" class="hidden px-3 py-3 pb-24"></div>
    <div id="page-settings" class="hidden px-4 py-4 pb-24"></div>
  </main>

  <!-- نوار ناوبری پایین -->
  <nav class="fixed bottom-0 inset-x-0 z-40">
    <div class="max-w-md mx-auto bg-white border-t border-slate-100 flex items-center justify-around py-2">
      <button data-page="contacts" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400 text-[11px] px-3 py-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        مخاطبین
      </button>
      <button data-page="calendar" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400 text-[11px] px-3 py-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        تقویم
      </button>
      <button data-page="stats" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400 text-[11px] px-3 py-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
        آمار
      </button>
      <button data-page="settings" class="nav-btn flex flex-col items-center gap-0.5 text-slate-400 text-[11px] px-3 py-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
        تنظیمات
      </button>
    </div>
  </nav>
</div>

<!-- مودال جزئیات مخاطب (باز شدن از کارت کوچک تقویم) -->
<div id="contact-modal" class="hidden fixed inset-0 z-[92] bg-black/40 flex items-end sm:items-center justify-center">
  <div class="bg-white w-full sm:max-w-md sm:rounded-3xl rounded-t-3xl max-h-[92vh] overflow-y-auto">
    <div class="sticky top-0 bg-white px-4 pt-4 pb-1 flex justify-end">
      <button id="contact-modal-close" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-400">✕</button>
    </div>
    <div id="contact-modal-body" class="px-3 pb-4"></div>
  </div>
</div>

<!-- مودال انتخاب تاریخ/ساعت قرار -->
<div id="appt-modal" class="hidden fixed inset-0 z-[95] bg-black/40 flex items-end sm:items-center justify-center">
  <div class="bg-white w-full sm:max-w-md sm:rounded-3xl rounded-t-3xl max-h-[92vh] overflow-y-auto">
    <div class="sticky top-0 bg-white px-5 pt-5 pb-3 border-b border-slate-100 flex items-center justify-between">
      <h2 id="appt-modal-title" class="font-bold text-slate-800">انتخاب روز</h2>
      <button id="appt-modal-close" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-400">✕</button>
    </div>
    <div id="appt-modal-body" class="px-5 py-4"></div>
  </div>
</div>

<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
