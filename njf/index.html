<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آگهی‌های املاک | املاک مدرن</title>

    <!-- ==================== CDN Resources ==================== -->
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Vazirmatn Persian Font from Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap">

    <style>
        /* ==================== متغیرهای ریشه و استایل‌های پایه ==================== */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.18);
            --glass-bg-strong: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.35);
            --glass-shadow: 0 8px 32px rgba(0, 20, 40, 0.12);
            --glass-blur: blur(16px);
            --accent: #0d6efd;
            --accent-teal: #0ea5a0;
            --accent-gradient: linear-gradient(135deg, #0d6efd 0%, #0ea5a0 100%);
            --price-color: #0b5e5a;
            --badge-sale: #e85d5d;
            --badge-rent: #5b8def;
            --badge-default: #6f7d90;
            --text-primary: #1a1f2e;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            --card-radius: 20px;
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background: linear-gradient(160deg, #e8f0fe 0%, #dceefb 15%, #e2f0f5 30%, #f0f4f8 50%, #e8f2f9 65%, #dce8f5 80%, #eaf1f8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
            line-height: 1.7;
        }

        /* دایره‌های تزئینی پس‌زمینه */
        body::before {
            content: '';
            position: fixed;
            top: -180px;
            left: -120px;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(13, 110, 253, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -200px;
            right: -100px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(14, 165, 160, 0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ==================== هدر شیشه‌ای ==================== */
        .glass-header {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem 2rem;
            margin: 1.5rem auto 1rem;
            max-width: 1300px;
            box-shadow: var(--glass-shadow);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: var(--transition-smooth);
        }
        .glass-header:hover {
            box-shadow: 0 12px 40px rgba(0, 20, 40, 0.16);
            transform: translateY(-2px);
        }
        .glass-header .logo-icon {
            font-size: 2.6rem;
            color: var(--accent-teal);
            margin-bottom: 0.3rem;
            display: inline-block;
            animation: floatIcon 3s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .glass-header h1 {
            font-weight: 800;
            font-size: 2rem;
            color: #1a2b3c;
            margin: 0;
            letter-spacing: -0.3px;
        }
        .glass-header .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 400;
            margin-top: 0.25rem;
        }

        /* ==================== پنل فیلتر شیشه‌ای ==================== */
        .filter-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem 1.8rem;
            margin: 0 auto 1.8rem;
            max-width: 1300px;
            box-shadow: var(--glass-shadow);
            position: relative;
            z-index: 10;
            transition: var(--transition-smooth);
        }
        .filter-panel:hover {
            box-shadow: 0 12px 40px rgba(0, 20, 40, 0.14);
        }
        .filter-panel .filter-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
            display: block;
        }
        .filter-panel .form-control,
        .filter-panel .form-select {
            border-radius: 14px;
            border: 1.5px solid rgba(180, 200, 220, 0.5);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            transition: var(--transition-fast);
            color: var(--text-primary);
        }
        .filter-panel .form-control:focus,
        .filter-panel .form-select:focus {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px rgba(14, 165, 160, 0.12);
            background: rgba(255, 255, 255, 0.85);
            outline: none;
        }
        .filter-panel .form-control::placeholder {
            color: #a0b0c0;
            font-size: 0.85rem;
        }
        /* استایل checkboxهای امکانات */
        .features-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.2rem;
            max-height: 160px;
            overflow-y: auto;
            padding: 0.5rem 0.3rem;
            scrollbar-width: thin;
            scrollbar-color: #c0d0dd transparent;
        }
        .features-checkboxes::-webkit-scrollbar {
            width: 5px;
        }
        .features-checkboxes::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 8px;
        }
        .features-checkboxes::-webkit-scrollbar-thumb {
            background: #c0d0dd;
            border-radius: 8px;
        }
        .feature-checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.82rem;
            cursor: pointer;
            user-select: none;
            color: var(--text-secondary);
            transition: var(--transition-fast);
            white-space: nowrap;
        }
        .feature-checkbox-item input[type="checkbox"] {
            accent-color: var(--accent-teal);
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .feature-checkbox-item:hover {
            color: var(--accent-teal);
        }
        .feature-checkbox-item input:checked+span {
            color: var(--accent-teal);
            font-weight: 600;
        }

        /* دکمه پاک‌سازی */
        .btn-clear-filters {
            background: rgba(255, 255, 255, 0.5);
            border: 1.5px solid rgba(180, 190, 200, 0.5);
            border-radius: 14px;
            padding: 0.55rem 1.4rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-fast);
            white-space: nowrap;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .btn-clear-filters:hover {
            background: rgba(255, 80, 80, 0.1);
            border-color: rgba(220, 80, 80, 0.5);
            color: #c0392b;
        }
        .btn-clear-filters i {
            margin-left: 0.3rem;
        }

        /* ==================== ناحیه نتایج ==================== */
        .results-info {
            max-width: 1300px;
            margin: 0 auto 0.8rem;
            padding: 0 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
            z-index: 5;
            position: relative;
        }
        .results-count {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 0.4rem 1.2rem;
            display: inline-block;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* ==================== کارت‌های املاک ==================== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.6rem;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 0.5rem 2rem;
            position: relative;
            z-index: 5;
        }

        .property-card {
            background: var(--glass-bg-strong);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1.5px solid var(--glass-border);
            border-radius: var(--card-radius);
            overflow: hidden;
            box-shadow: var(--glass-shadow);
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            position: relative;
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .property-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 48px rgba(0, 20, 40, 0.18);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .property-card .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 210px;
            overflow: hidden;
            flex-shrink: 0;
            background: linear-gradient(135deg, #e9eef3 0%, #dce4ed 100%);
        }
        .property-card .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .property-card:hover .card-img-wrapper img {
            transform: scale(1.06);
        }
        .property-card .card-img-wrapper .img-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 3.5rem;
            color: #bcc8d6;
            background: linear-gradient(135deg, #eef2f7 0%, #e0e7ef 100%);
        }
        .property-card .type-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            padding: 0.35rem 1rem;
            border-radius: 25px;
            font-size: 0.78rem;
            font-weight: 700;
            color: #fff;
            z-index: 2;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            letter-spacing: 0.2px;
        }
        .badge-sale {
            background: rgba(220, 70, 70, 0.85);
        }
        .badge-rent {
            background: rgba(50, 120, 220, 0.85);
        }
        .badge-other {
            background: rgba(100, 115, 135, 0.8);
        }

        .property-card .card-body-custom {
            padding: 1.2rem 1.3rem 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }
        .property-card .location-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 500;
        }
        .property-card .location-row i {
            color: var(--accent-teal);
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .property-card .price-tag {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--price-color);
            margin: 0.15rem 0;
            letter-spacing: -0.3px;
        }
        .property-card .price-tag.call-price {
            color: #c07830;
            font-size: 1.1rem;
        }
        .property-card .address-text {
            font-size: 0.83rem;
            color: var(--text-secondary);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .property-card .areas-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .property-card .areas-row span {
            background: rgba(200, 215, 230, 0.35);
            padding: 0.25rem 0.7rem;
            border-radius: 15px;
            font-weight: 500;
            white-space: nowrap;
        }
        .property-card .features-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }
        .property-card .feature-tag {
            background: rgba(14, 165, 160, 0.1);
            color: #0a7a75;
            padding: 0.2rem 0.65rem;
            border-radius: 15px;
            font-size: 0.72rem;
            font-weight: 500;
            border: 1px solid rgba(14, 165, 160, 0.2);
            white-space: nowrap;
        }
        .property-card .notes-text {
            font-size: 0.8rem;
            color: #5a6b78;
            background: rgba(245, 240, 220, 0.5);
            padding: 0.5rem 0.8rem;
            border-radius: 10px;
            border-right: 3px solid #e0c860;
            line-height: 1.6;
            max-height: 70px;
            overflow-y: auto;
        }
        .property-card .owner-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-top: auto;
            padding-top: 0.6rem;
            border-top: 1px solid rgba(180, 195, 210, 0.35);
            flex-wrap: wrap;
        }
        .property-card .owner-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
        .property-card .owner-name i {
            color: var(--accent-teal);
            margin-left: 0.3rem;
        }
        .property-card .action-btns {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .property-card .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.9rem;
            border-radius: 25px;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition-fast);
            border: 1.5px solid transparent;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-call {
            background: rgba(25, 135, 84, 0.12);
            color: #198754;
            border-color: rgba(25, 135, 84, 0.35);
        }
        .btn-call:hover {
            background: #198754;
            color: #fff;
            border-color: #198754;
        }
        .btn-map {
            background: rgba(13, 110, 253, 0.1);
            color: #0d6efd;
            border-color: rgba(13, 110, 253, 0.3);
        }
        .btn-map:hover {
            background: #0d6efd;
            color: #fff;
            border-color: #0d6efd;
        }
        .property-card .update-date {
            font-size: 0.7rem;
            color: #a0aeb8;
            text-align: left;
            direction: ltr;
            margin-top: 0.2rem;
        }

        /* ==================== اسپینر بارگذاری ==================== */
        .spinner-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            z-index: 20;
            position: relative;
        }
        .spinner-custom {
            width: 55px;
            height: 55px;
            border: 5px solid rgba(14, 165, 160, 0.15);
            border-top-color: var(--accent-teal);
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ==================== پیام‌های وضعیت ==================== */
        .status-message {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 600px;
            margin: 0 auto;
            z-index: 5;
            position: relative;
        }
        .status-message .status-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
        }
        .status-message .status-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .status-message.error .status-icon {
            color: #e74c3c;
        }
        .status-message.empty .status-icon {
            color: #b0bec5;
        }
        .status-message.error {
            background: rgba(255, 230, 230, 0.6);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(220, 100, 100, 0.3);
        }
        .status-message.empty {
            background: rgba(240, 242, 245, 0.5);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(180, 190, 200, 0.3);
        }

        /* ==================== فوتر ==================== */
        .glass-footer {
            text-align: center;
            padding: 1rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            position: relative;
            z-index: 5;
            margin-top: 0.5rem;
        }

        /* ==================== واکنش‌گرایی ==================== */
        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
                padding: 0 0.3rem 1.5rem;
            }
            .glass-header {
                padding: 1.2rem 1rem;
                margin: 0.8rem 0.5rem 0.6rem;
                border-radius: 16px;
            }
            .glass-header h1 {
                font-size: 1.4rem;
            }
            .filter-panel {
                padding: 1rem;
                margin: 0 0.5rem 1.2rem;
                border-radius: 16px;
            }
            .filter-panel .row>div {
                margin-bottom: 0.6rem;
            }
            .property-card .card-img-wrapper {
                height: 180px;
            }
            .features-checkboxes {
                max-height: 130px;
                gap: 0.3rem 0.8rem;
            }
            .btn-clear-filters {
                width: 100%;
                text-align: center;
            }
        }
        @media (min-width: 769px) and (max-width: 1024px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.4rem;
            }
        }
        @media (min-width: 1400px) {
            .cards-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- ==================== هدر ==================== -->
    <header class="glass-header">
        <div class="logo-icon">
            <i class="fa-solid fa-building-columns"></i>
        </div>
        <h1>آگهی‌های املاک</h1>
        <p class="subtitle">جدیدترین فرصت‌های ملکی — خرید، فروش و اجاره</p>
    </header>

    <!-- ==================== پنل فیلتر ==================== -->
    <div class="filter-panel" id="filterPanel">
        <div class="row g-3 align-items-end">
            <!-- جستجوی متنی -->
            <div class="col-12 col-md-4 col-lg-3">
                <label class="filter-label" for="searchInput">
                    <i class="fa-solid fa-magnifying-glass"></i> جستجو
                </label>
                <input type="text" id="searchInput" class="form-control" placeholder="عنوان، شهر، آدرس یا یادداشت...">
            </div>
            <!-- انتخاب شهر -->
            <div class="col-6 col-md-3 col-lg-2">
                <label class="filter-label" for="cityFilter">
                    <i class="fa-solid fa-city"></i> شهر
                </label>
                <select id="cityFilter" class="form-select">
                    <option value="">همه شهرها</option>
                </select>
            </div>
            <!-- انتخاب نوع ملک -->
            <div class="col-6 col-md-3 col-lg-2">
                <label class="filter-label" for="typeFilter">
                    <i class="fa-solid fa-tag"></i> نوع ملک
                </label>
                <select id="typeFilter" class="form-select">
                    <option value="">همه انواع</option>
                </select>
            </div>
            <!-- بازه قیمت -->
            <div class="col-6 col-md-3 col-lg-2">
                <label class="filter-label" for="priceMin">
                    <i class="fa-solid fa-arrow-down-wide-short"></i> حداقل قیمت (تومان)
                </label>
                <input type="number" id="priceMin" class="form-control" placeholder="مثلاً ۱۰۰۰۰۰۰۰۰" min="0" step="1000000">
            </div>
            <div class="col-6 col-md-3 col-lg-2">
                <label class="filter-label" for="priceMax">
                    <i class="fa-solid fa-arrow-up-wide-short"></i> حداکثر قیمت (تومان)
                </label>
                <input type="number" id="priceMax" class="form-control" placeholder="مثلاً ۵۰۰۰۰۰۰۰۰" min="0" step="1000000">
            </div>
            <!-- دکمه پاک‌سازی -->
            <div class="col-12 col-md-auto col-lg-1 d-flex align-items-end">
                <button class="btn-clear-filters" id="btnClearFilters" title="پاک کردن همه فیلترها">
                    <i class="fa-solid fa-rotate-left"></i> پاک‌سازی
                </button>
            </div>
        </div>
        <!-- فیلتر امکانات (چک‌باکس‌های پویا) -->
        <div class="row mt-3">
            <div class="col-12">
                <label class="filter-label mb-2">
                    <i class="fa-solid fa-check-double"></i> فیلتر بر اساس امکانات (همه موارد انتخاب‌شده لازم است):
                </label>
                <div class="features-checkboxes" id="featuresCheckboxes">
                    <!-- چک‌باکس‌های امکانات به‌صورت پویا توسط جاوااسکریپت پر می‌شوند -->
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== اطلاعات نتایج ==================== -->
    <div class="results-info" id="resultsInfo" style="display:none;">
        <span class="results-count" id="resultsCount">نمایش ۰ آگهی</span>
    </div>

    <!-- ==================== اسپینر بارگذاری ==================== -->
    <div class="spinner-wrapper" id="spinnerWrapper">
        <div class="spinner-custom"></div>
        <p style="text-align:center;margin-top:1rem;color:#5a7a8a;font-weight:500;">در حال بارگذاری آگهی‌ها...</p>
    </div>

    <!-- ==================== پیام‌های وضعیت ==================== -->
    <div class="status-message error" id="errorMessage" style="display:none;">
        <span class="status-icon"><i class="fa-solid fa-circle-exclamation"></i></span>
        <p class="status-text" id="errorText">خطایی رخ داده است.</p>
    </div>
    <div class="status-message empty" id="emptyMessage" style="display:none;">
        <span class="status-icon"><i class="fa-solid fa-house-circle-xmark"></i></span>
        <p class="status-text">موردی یافت نشد</p>
        <p style="color:#8899aa;font-size:0.9rem;">لطفاً فیلترهای دیگری را امتحان کنید یا دکمه پاک‌سازی را بزنید.</p>
    </div>

    <!-- ==================== شبکه کارت‌های املاک ==================== -->
    <div class="cards-grid" id="cardsGrid"></div>

    <!-- ==================== فوتر ==================== -->
    <footer class="glass-footer">
        <p>© ۱۴۰۴ · سامانه آگهی‌های املاک · طراحی شده با <i class="fa-solid fa-heart" style="color:#e85d5d;"></i></p>
    </footer>

    <!-- ==================== Bootstrap JS Bundle ==================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- ==================== اسکریپت اصلی ==================== -->
    <script>
        (function() {
            // ==================== ارجاعات به عناصر DOM ====================
            const cardsGrid = document.getElementById('cardsGrid');
            const spinnerWrapper = document.getElementById('spinnerWrapper');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const emptyMessage = document.getElementById('emptyMessage');
            const resultsInfo = document.getElementById('resultsInfo');
            const resultsCount = document.getElementById('resultsCount');
            const featuresCheckboxes = document.getElementById('featuresCheckboxes');
            const searchInput = document.getElementById('searchInput');
            const cityFilter = document.getElementById('cityFilter');
            const typeFilter = document.getElementById('typeFilter');
            const priceMin = document.getElementById('priceMin');
            const priceMax = document.getElementById('priceMax');
            const btnClearFilters = document.getElementById('btnClearFilters');

            // ==================== متغیرهای سراسری ====================
            let allListings = []; // تمام آگهی‌های دریافت‌شده از JSON
            let filteredListings = []; // آگهی‌های فیلترشده
            let allFeatures = []; // لیست уникальных امکانات برای چک‌باکس‌ها

            // ==================== تابع escape HTML برای جلوگیری از XSS ====================
            function escapeHTML(str) {
                if (typeof str !== 'string') return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ==================== فرمت‌کننده اعداد فارسی با جداکننده هزارگان ====================
            function formatPersianNumber(num) {
                if (num === null || num === undefined || isNaN(num) || num <= 0) return null;
                try {
                    const formatted = Number(num).toLocaleString('fa-IR', { useGrouping: true });
                    return formatted;
                } catch (e) {
                    // Fallback: تبدیل دستی
                    const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
                    let str = String(Math.floor(num));
                    let result = '';
                    let count = 0;
                    for (let i = str.length - 1; i >= 0; i--) {
                        result = persianDigits[parseInt(str[i])] + result;
                        count++;
                        if (count === 3 && i > 0) {
                            result = '٬' + result;
                            count = 0;
                        }
                    }
                    return result;
                }
            }

            // ==================== تعیین نوع برچسب ملک ====================
            function getTypeBadgeClass(typeStr) {
                if (!typeStr) return 'badge-other';
                const t = typeStr.trim().toLowerCase();
                if (t.includes('فروش') || t.includes('خرید') || t.includes(' sale') || t === 'sale') return 'badge-sale';
                if (t.includes('اجاره') || t.includes('رهن') || t.includes('rent') || t.includes('lease'))
            return 'badge-rent';
                return 'badge-other';
            }

            // ==================== ساخت کارت برای یک آگهی ====================
            function createPropertyCard(listing) {
                const card = document.createElement('div');
                card.className = 'property-card';

                // --- بخش تصویر ---
                const imgWrapper = document.createElement('div');
                imgWrapper.className = 'card-img-wrapper';

                const firstImage = (listing.images && Array.isArray(listing.images) && listing.images.length > 0) ?
                    listing.images[0] : null;

                if (firstImage && typeof firstImage === 'string' && firstImage.trim() !== '') {
                    const img = document.createElement('img');
                    img.src = escapeHTML(firstImage.trim());
                    img.alt = escapeHTML(listing.type || 'ملک');
                    img.loading = 'lazy';
                    // در صورت خرابی تصویر، placeholder نشان بده
                    img.onerror = function() {
                        img.style.display = 'none';
                        const placeholder = document.createElement('div');
                        placeholder.className = 'img-placeholder';
                        placeholder.innerHTML = '<i class="fa-solid fa-house-chimney"></i>';
                        imgWrapper.appendChild(placeholder);
                    };
                    imgWrapper.appendChild(img);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'img-placeholder';
                    placeholder.innerHTML = '<i class="fa-solid fa-house-chimney"></i>';
                    imgWrapper.appendChild(placeholder);
                }

                // برچسب نوع ملک روی تصویر
                const typeBadge = document.createElement('span');
                typeBadge.className = 'type-badge ' + getTypeBadgeClass(listing.type || '');
                typeBadge.textContent = listing.type || 'نامشخص';
                imgWrapper.appendChild(typeBadge);

                card.appendChild(imgWrapper);

                // --- بدنه کارت ---
                const cardBody = document.createElement('div');
                cardBody.className = 'card-body-custom';

                // شهر و منطقه
                const locationRow = document.createElement('div');
                locationRow.className = 'location-row';
                locationRow.innerHTML = '<i class="fa-solid fa-location-dot"></i> ';
                const locationText = [listing.city, listing.district].filter(Boolean).join('، ');
                locationRow.appendChild(document.createTextNode(locationText || 'موقعیت نامشخص'));
                cardBody.appendChild(locationRow);

                // قیمت
                const priceTag = document.createElement('div');
                priceTag.className = 'price-tag';
                const priceNum = Number(listing.price);
                if (!listing.price || priceNum <= 0 || isNaN(priceNum)) {
                    priceTag.textContent = 'تماس بگیرید';
                    priceTag.classList.add('call-price');
                } else {
                    const formatted = formatPersianNumber(priceNum);
                    priceTag.textContent = (formatted || String(priceNum)) + ' تومان';
                }
                cardBody.appendChild(priceTag);

                // آدرس
                if (listing.address) {
                    const addressEl = document.createElement('div');
                    addressEl.className = 'address-text';
                    addressEl.textContent = listing.address;
                    addressEl.title = listing.address; // tooltip برای متن کامل
                    cardBody.appendChild(addressEl);
                }

                // متراژ بنا و زمین
                const areasRow = document.createElement('div');
                areasRow.className = 'areas-row';
                if (listing.buildArea) {
                    const buildSpan = document.createElement('span');
                    buildSpan.innerHTML = '<i class="fa-solid fa-ruler-combined"></i> بنا: ' + escapeHTML(String(listing
                        .buildArea));
                    areasRow.appendChild(buildSpan);
                }
                if (listing.landArea) {
                    const landSpan = document.createElement('span');
                    landSpan.innerHTML = '<i class="fa-solid fa-vector-square"></i> زمین: ' + escapeHTML(String(listing
                        .landArea));
                    areasRow.appendChild(landSpan);
                }
                if (areasRow.children.length > 0) {
                    cardBody.appendChild(areasRow);
                }

                // امکانات (ویژگی‌ها)
                if (listing.features && Array.isArray(listing.features) && listing.features.length > 0) {
                    const featuresTags = document.createElement('div');
                    featuresTags.className = 'features-tags';
                    listing.features.forEach(feature => {
                        if (feature && String(feature).trim()) {
                            const tag = document.createElement('span');
                            tag.className = 'feature-tag';
                            tag.textContent = String(feature).trim();
                            featuresTags.appendChild(tag);
                        }
                    });
                    if (featuresTags.children.length > 0) {
                        cardBody.appendChild(featuresTags);
                    }
                }

                // یادداشت‌ها
                if (listing.notes && String(listing.notes).trim()) {
                    const notesEl = document.createElement('div');
                    notesEl.className = 'notes-text';
                    notesEl.textContent = String(listing.notes).trim();
                    cardBody.appendChild(notesEl);
                }

                // ردیف مالک و دکمه‌ها
                const ownerRow = document.createElement('div');
                ownerRow.className = 'owner-row';

                const ownerName = document.createElement('span');
                ownerName.className = 'owner-name';
                ownerName.innerHTML = '<i class="fa-solid fa-user"></i> ' + escapeHTML(listing.owner || 'نامشخص');
                ownerRow.appendChild(ownerName);

                const actionBtns = document.createElement('div');
                actionBtns.className = 'action-btns';

                // دکمه تماس
                if (listing.phone && String(listing.phone).trim()) {
                    const phoneClean = String(listing.phone).replace(/[^\d+]/g, '');
                    const callBtn = document.createElement('a');
                    callBtn.className = 'btn-action btn-call';
                    callBtn.href = 'tel:' + phoneClean;
                    callBtn.innerHTML = '<i class="fa-solid fa-phone"></i> تماس';
                    callBtn.title = 'شماره: ' + escapeHTML(String(listing.phone));
                    actionBtns.appendChild(callBtn);
                }

                // دکمه نقشه
                if (listing.latitude && listing.longitude &&
                    !isNaN(Number(listing.latitude)) && !isNaN(Number(listing.longitude))) {
                    const mapBtn = document.createElement('a');
                    mapBtn.className = 'btn-action btn-map';
                    mapBtn.href = 'https://www.google.com/maps?q=' + Number(listing.latitude) + ',' + Number(listing
                        .longitude);
                    mapBtn.target = '_blank';
                    mapBtn.rel = 'noopener noreferrer';
                    mapBtn.innerHTML = '<i class="fa-solid fa-map-location-dot"></i> نقشه';
                    actionBtns.appendChild(mapBtn);
                }

                ownerRow.appendChild(actionBtns);
                cardBody.appendChild(ownerRow);

                // تاریخ به‌روزرسانی
                if (listing.updatedAt) {
                    try {
                        const dateObj = new Date(listing.updatedAt);
                        if (!isNaN(dateObj.getTime())) {
                            const updateDate = document.createElement('div');
                            updateDate.className = 'update-date';
                            const persianDate = dateObj.toLocaleDateString('fa-IR', {
                                year: 'numeric',
                                month: 'short',
                                day: 'numeric'
                            });
                            updateDate.textContent = '📅 ' + persianDate;
                            cardBody.appendChild(updateDate);
                        }
                    } catch (e) {
                        // ignore date parsing errors
                    }
                }

                card.appendChild(cardBody);
                return card;
            }

            // ==================== رندر تمام کارت‌ها ====================
            function renderCards(listings) {
                cardsGrid.innerHTML = '';
                if (!listings || listings.length === 0) {
                    emptyMessage.style.display = 'block';
                    resultsInfo.style.display = 'none';
                    return;
                }
                emptyMessage.style.display = 'none';
                resultsInfo.style.display = 'block';
                resultsCount.textContent = 'نمایش ' + formatPersianNumber(listings.length) + ' آگهی';

                listings.forEach((listing, index) => {
                    const card = createPropertyCard(listing);
                    // تأخیر جزئی برای انیمیشن آبشاری
                    card.style.animationDelay = (index * 0.04) + 's';
                    cardsGrid.appendChild(card);
                });
            }

            // ==================== جمع‌آوری امکانات یکتا از همه آگهی‌ها ====================
            function collectAllFeatures(listings) {
                const featureSet = new Set();
                listings.forEach(listing => {
                    if (listing.features && Array.isArray(listing.features)) {
                        listing.features.forEach(f => {
                            if (f && String(f).trim()) {
                                featureSet.add(String(f).trim());
                            }
                        });
                    }
                });
                // مرتب‌سازی فارسی
                const featuresArray = Array.from(featureSet);
                featuresArray.sort((a, b) => a.localeCompare(b, 'fa'));
                return featuresArray;
            }

            // ==================== ساخت چک‌باکس‌های امکانات ====================
            function buildFeatureCheckboxes(features) {
                featuresCheckboxes.innerHTML = '';
                if (features.length === 0) {
                    featuresCheckboxes.innerHTML =
                        '<span style="color:#8899aa;font-size:0.8rem;">امکاناتی برای فیلتر یافت نشد.</span>';
                    return;
                }
                features.forEach(feature => {
                    const label = document.createElement('label');
                    label.className = 'feature-checkbox-item';
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.value = feature;
                    checkbox.classList.add('feature-filter-checkbox');
                    const span = document.createElement('span');
                    span.textContent = feature;
                    label.appendChild(checkbox);
                    label.appendChild(span);
                    featuresCheckboxes.appendChild(label);
                });
            }

            // ==================== دریافت ویژگی‌های انتخاب‌شده ====================
            function getSelectedFeatures() {
                const checkboxes = featuresCheckboxes.querySelectorAll('.feature-filter-checkbox:checked');
                return Array.from(checkboxes).map(cb => cb.value);
            }

            // ==================== اعمال همه فیلترها ====================
            function applyFilters() {
                const searchTerm = searchInput.value.trim().toLowerCase();
                const selectedCity = cityFilter.value;
                const selectedType = typeFilter.value;
                const minPrice = priceMin.value ? Number(priceMin.value) : null;
                const maxPrice = priceMax.value ? Number(priceMax.value) : null;
                const selectedFeatures = getSelectedFeatures();

                filteredListings = allListings.filter(listing => {
                    // فیلتر جستجوی متنی
                    if (searchTerm) {
                        const searchFields = [
                            listing.type,
                            listing.city,
                            listing.district,
                            listing.address,
                            listing.notes
                        ].filter(Boolean).map(s => String(s).toLowerCase());
                        const combined = searchFields.join(' ');
                        if (!combined.includes(searchTerm)) {
                            return false;
                        }
                    }

                    // فیلتر شهر
                    if (selectedCity && listing.city !== selectedCity) {
                        return false;
                    }

                    // فیلتر نوع ملک
                    if (selectedType && listing.type !== selectedType) {
                        return false;
                    }

                    // فیلتر بازه قیمت
                    const priceNum = Number(listing.price);
                    const hasValidPrice = listing.price && priceNum > 0 && !isNaN(priceNum);
                    if (minPrice !== null) {
                        if (!hasValidPrice || priceNum < minPrice) return false;
                    }
                    if (maxPrice !== null) {
                        if (!hasValidPrice || priceNum > maxPrice) return false;
                    }

                    // فیلتر امکانات (AND)
                    if (selectedFeatures.length > 0) {
                        const listingFeatures = (listing.features && Array.isArray(listing.features)) ?
                            listing.features.map(f => String(f).trim()) : [];
                        const hasAll = selectedFeatures.every(sf => listingFeatures.includes(sf));
                        if (!hasAll) return false;
                    }

                    return true;
                });

                renderCards(filteredListings);
            }

            // ==================== پاک‌سازی همه فیلترها ====================
            function clearAllFilters() {
                searchInput.value = '';
                cityFilter.value = '';
                typeFilter.value = '';
                priceMin.value = '';
                priceMax.value = '';
                const checkboxes = featuresCheckboxes.querySelectorAll('.feature-filter-checkbox');
                checkboxes.forEach(cb => cb.checked = false);
                applyFilters();
            }

            // ==================== پر کردن dropdownهای پویا ====================
            function populateDropdowns(listings) {
                // شهرها
                const cities = [...new Set(listings.map(l => l.city).filter(Boolean))];
                cities.sort((a, b) => String(a).localeCompare(String(b), 'fa'));
                cityFilter.innerHTML = '<option value="">همه شهرها</option>';
                cities.forEach(city => {
                    const opt = document.createElement('option');
                    opt.value = city;
                    opt.textContent = city;
                    cityFilter.appendChild(opt);
                });

                // انواع ملک
                const types = [...new Set(listings.map(l => l.type).filter(Boolean))];
                types.sort((a, b) => String(a).localeCompare(String(b), 'fa'));
                typeFilter.innerHTML = '<option value="">همه انواع</option>';
                types.forEach(type => {
                    const opt = document.createElement('option');
                    opt.value = type;
                    opt.textContent = type;
                    typeFilter.appendChild(opt);
                });
            }

            // ==================== دریافت داده از GitHub ====================
            async function fetchData() {
                const url =
                    'https://raw.githubusercontent.com/WebTci/data-amlak/refs/heads/main/data.json';
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`خطای HTTP: ${response.status} — ${response.statusText}`);
                    }
                    const data = await response.json();
                    if (!Array.isArray(data)) {
                        throw new Error('فرمت داده‌ها نامعتبر است. آرایه مورد انتظار بود.');
                    }
                    return data;
                } catch (err) {
                    throw err;
                }
            }

            // ==================== راه‌اندازی اولیه ====================
            async function initialize() {
                // نمایش اسپینر
                spinnerWrapper.style.display = 'flex';
                errorMessage.style.display = 'none';
                emptyMessage.style.display = 'none';
                resultsInfo.style.display = 'none';
                cardsGrid.innerHTML = '';

                try {
                    const data = await fetchData();
                    allListings = data;

                    // مخفی کردن اسپینر
                    spinnerWrapper.style.display = 'none';

                    if (allListings.length === 0) {
                        emptyMessage.style.display = 'block';
                        emptyMessage.querySelector('.status-text').textContent = 'هیچ آگهی‌ای موجود نیست';
                        return;
                    }

                    // پر کردن dropdownها
                    populateDropdowns(allListings);

                    // جمع‌آوری و ساخت چک‌باکس‌های امکانات
                    allFeatures = collectAllFeatures(allListings);
                    buildFeatureCheckboxes(allFeatures);

                    // نمایش همه آگهی‌ها
                    filteredListings = [...allListings];
                    renderCards(filteredListings);

                } catch (err) {
                    spinnerWrapper.style.display = 'none';
                    errorMessage.style.display = 'block';
                    errorText.textContent = 'خطا در دریافت داده‌ها: ' + err.message;
                    console.error('Fetch error:', err);
                }
            }

            // ==================== اتصال رویدادها به فیلترها ====================
            searchInput.addEventListener('input', function() {
                applyFilters();
            });
            cityFilter.addEventListener('change', function() {
                applyFilters();
            });
            typeFilter.addEventListener('change', function() {
                applyFilters();
            });
            priceMin.addEventListener('input', function() {
                applyFilters();
            });
            priceMax.addEventListener('input', function() {
                applyFilters();
            });
            // رویداد برای چک‌باکس‌های امکانات (با event delegation)
            featuresCheckboxes.addEventListener('change', function(e) {
                if (e.target.classList.contains('feature-filter-checkbox')) {
                    applyFilters();
                }
            });
            // دکمه پاک‌سازی
            btnClearFilters.addEventListener('click', function() {
                clearAllFilters();
            });

            // ==================== اجرای برنامه ====================
            initialize();
        })();
    </script>
</body>
</html>
